<div class="absolute inset-0 z-[100] bg-surface/70 backdrop-blur-[20px] flex flex-col items-center justify-center border border-outline-variant/30 hidden" id="pauseOverlay">
<h2 class="font-headline-lg text-headline-lg md:text-[64px] md:leading-[72px] text-primary mb-margin-desktop drop-shadow-[0_0_12px_rgba(0,219,231,0.8)] tracking-widest">SYSTEM PAUSED</h2>

<span class="relative z-10 group-hover:drop-shadow-[0_0_8px_rgba(0,219,231,1)]">RESUME FLIGHT</span>
<div class="absolute inset-0 border border-surface-tint opacity-50 scale-105 group-hover:scale-100 transition-transform duration-300 pointer-events-none"></div>
</button>
<div class="mt-margin-desktop font-label-mono text-label-mono text-on-surface-variant flex items-center gap-2">
            PRESS <kbd class="px-2 py-1 bg-surface-container border border-outline-variant/50 rounded text-surface-tint">P</kbd> TO PAUSE/RESUME
        </div>
</div>
<script>
        let isPaused = false;
        const overlay = document.getElementById('pauseOverlay');

        function togglePause() {
            isPaused = !isPaused;
            if(isPaused) {
                overlay.classList.remove('hidden');
                // In a real game, pause logic here
            } else {
                overlay.classList.add('hidden');
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'p') {
                togglePause();
            }
        });
    </script>
